linux:
  cards:
    - q: "What is the kernel responsible for?"
      a: "It arbitrates CPU, memory, IO, devices, filesystems, networking, security boundaries, and syscalls."
    - q: "What does fork create?"
      a: "A child process with a new PID and copied process metadata, usually sharing memory pages copy-on-write at first."
    - q: "What does execve change?"
      a: "It replaces the current process image with a new program while keeping the same PID."
    - q: "Why do zombie processes exist?"
      a: "The child exited, but its parent has not collected the exit status with wait."
    - q: "What does uninterruptible sleep often mean?"
      a: "A task is waiting in a kernel path, commonly storage or filesystem IO, and cannot currently handle signals."
    - q: "What is a file descriptor?"
      a: "A per-process integer handle referring to an open file, socket, pipe, device, epoll object, or similar kernel object."
    - q: "Why can deleted files still consume disk?"
      a: "A process may still hold an open file descriptor to the deleted inode until it closes the file."
    - q: "What does ulimit -n control?"
      a: "The maximum number of open file descriptors allowed for a process."
    - q: "What does RSS measure?"
      a: "Resident Set Size, the physical memory currently mapped into a process."
    - q: "Why is low free memory normal?"
      a: "Linux uses available RAM for page cache and buffers that can often be reclaimed."
    - q: "What is page cache?"
      a: "RAM used to cache file contents and filesystem metadata for faster future access."
    - q: "What is swap useful for?"
      a: "It can move cold anonymous pages out of RAM, but heavy swap-in and swap-out indicates memory pressure."
    - q: "What does vm.swappiness influence?"
      a: "The tendency to reclaim anonymous memory through swap versus reclaiming file-backed cache."
    - q: "What does the OOM killer do?"
      a: "It kills selected processes when the kernel cannot reclaim enough memory to satisfy allocations."
    - q: "What does cgroup memory.max do?"
      a: "It sets a hard memory limit for a cgroup, such as a service or container."
    - q: "What does CPU load average include?"
      a: "Runnable tasks and tasks in uninterruptible sleep, not just tasks actively running on CPU."
    - q: "What does IO wait represent?"
      a: "Time when the CPU is idle while tasks are waiting for IO completion."
    - q: "What does steal time indicate?"
      a: "A virtual CPU wanted to run, but the hypervisor scheduled something else."
    - q: "What is Pressure Stall Information?"
      a: "Kernel metrics showing time tasks lost waiting for CPU, memory, or IO resources."
    - q: "What is a sysctl?"
      a: "A runtime kernel tunable exposed under /proc/sys and managed with the sysctl command."
    - q: "Where are persistent sysctls commonly stored?"
      a: "In /etc/sysctl.conf or files under /etc/sysctl.d."
    - q: "What does vm.max_map_count limit?"
      a: "The number of virtual memory areas a process can have, important for databases, JVMs, and search engines."
    - q: "What is a physical volume in LVM?"
      a: "A block device or partition initialized with LVM metadata."
    - q: "What is a volume group in LVM?"
      a: "A pool of storage made from one or more physical volumes."
    - q: "What is a logical volume?"
      a: "A virtual block device allocated from a volume group."
    - q: "What is a physical extent?"
      a: "The allocation unit used by LVM inside a volume group."
    - q: "What does lvextend -r do?"
      a: "It grows the logical volume and asks LVM to resize the filesystem as part of the operation."
    - q: "Why is lvreduce dangerous?"
      a: "Shrinking the block device before or beyond the filesystem can destroy data."
    - q: "What does pvmove do?"
      a: "It migrates allocated extents from one physical volume to another in the same volume group."
    - q: "Why run vgcfgbackup?"
      a: "It saves volume group metadata that can help recover LVM mappings after metadata damage."
    - q: "What is an LVM thin pool?"
      a: "A pool that allocates blocks to thin volumes on demand instead of reserving all virtual size upfront."
    - q: "What must be watched in thin pools?"
      a: "Both data_percent and metadata_percent, because exhausting either can interrupt writes."
    - q: "What is a classic LVM snapshot?"
      a: "A copy-on-write view of a logical volume at a point in time."
    - q: "What happens if an LVM snapshot fills?"
      a: "The snapshot becomes invalid and can no longer provide a consistent view."
    - q: "What is systemd?"
      a: "A Linux init system and service manager that models units, dependencies, logs, and cgroup resource boundaries."
    - q: "What is a systemd unit?"
      a: "An ini-style object that describes a service, socket, target, timer, mount, slice, or other managed resource."
    - q: "What is a target?"
      a: "A grouping and synchronization unit used to express boot or service states."
    - q: "What is a systemd drop-in?"
      a: "A .conf file in a unit-specific .d directory that overrides or extends the base unit."
    - q: "Why run systemctl daemon-reload?"
      a: "It makes systemd reload unit definitions after files or drop-ins change."
    - q: "What does journalctl -u show?"
      a: "Journal entries associated with a specific systemd unit."
    - q: "What is a systemd timer?"
      a: "A unit that activates another unit based on calendar or monotonic time."
    - q: "What do systemd resource controls use underneath?"
      a: "Linux cgroups."
    - q: "What is resolv.conf?"
      a: "The traditional configuration file for the libc stub resolver."
    - q: "What does nameserver set?"
      a: "The recursive resolver IP address that local resolver code should query."
    - q: "What does search set?"
      a: "Suffixes that are appended to relative DNS names during resolution."
    - q: "What does ndots control?"
      a: "How many dots a name must contain before it is tried as absolute first."
    - q: "Why can ndots cause extra DNS traffic?"
      a: "Names below the threshold may be expanded through each search suffix before the absolute lookup succeeds."
    - q: "What does systemd-resolved often put in resolv.conf?"
      a: "A local stub resolver address such as 127.0.0.53."
    - q: "What does amdgpu provide?"
      a: "The Linux DRM kernel driver for many AMD GPU families."
    - q: "What does nvidia-smi report?"
      a: "NVIDIA GPU state such as utilization, memory, power, temperature, driver status, and running processes."
    - q: "What does a UID identify?"
      a: "The numeric Linux user identity that the kernel uses for process credentials and file ownership."
    - q: "Why check /etc/shadow during account troubleshooting?"
      a: "It stores password hashes and aging state, so it can reveal locked or expired local accounts."
    - q: "Why can directory execute permission matter?"
      a: "A process needs execute permission on each parent directory to traverse the path."
    - q: "What does sudo -l show?"
      a: "The sudo privileges available to the current user under the active sudoers policy."
    - q: "What does sshd -T show?"
      a: "The effective OpenSSH server configuration after parsing config files and defaults."
    - q: "What do SSH host keys authenticate?"
      a: "The server identity presented to SSH clients."
    - q: "Why use journalctl -u ssh while testing logins?"
      a: "It shows server-side SSH, PAM, account, and authentication failures."
    - q: "What does journald provide?"
      a: "Structured system logs with fields such as unit, priority, boot ID, PID, executable, and message."
    - q: "Why does dmesg matter in incidents?"
      a: "It exposes kernel messages such as driver errors, OOM kills, filesystem faults, and hardware warnings."
    - q: "What problem does logrotate solve?"
      a: "It rotates, compresses, and expires traditional log files under paths such as /var/log."
    - q: "Why can cron jobs fail when manual commands work?"
      a: "Cron runs with a smaller environment, different PATH, and often a different working directory."
    - q: "Why are systemd timers useful for system jobs?"
      a: "They integrate with service dependencies, logs, missed-run handling, resource controls, and isolation."
    - q: "What does idempotent automation mean?"
      a: "Rerunning the job does not corrupt state or create unintended duplicate effects."
    - q: "What does timedatectl summarize?"
      a: "Local time, universal time, RTC time, timezone, and time synchronization state."
    - q: "Why does machine-id matter?"
      a: "It gives an installed system a stable unique local identity; duplicate IDs from cloned images can confuse services."
    - q: "Why are /dev/sdX names risky in persistent config?"
      a: "They can change across boots or attach order; use UUIDs, labels, by-id paths, or logical names."
    - q: "What does lsblk show that protects storage operations?"
      a: "Device type, size, filesystem, mountpoints, and parent-child storage relationships."
    - q: "What is a GPT partition table?"
      a: "A modern disk partition table format used to divide a disk into partitions."
    - q: "Why run findmnt --verify?"
      a: "It checks fstab and mount configuration before a reboot turns mistakes into boot failures."
    - q: "What does x-systemd.automount do?"
      a: "It creates a systemd automount that mounts the filesystem on first access."
    - q: "Why can df -h miss a storage problem?"
      a: "Inodes, quotas, read-only remounts, or lower-layer errors can block writes despite free bytes."
    - q: "Can XFS shrink in place?"
      a: "No. XFS supports online growth but not in-place shrink."
    - q: "Why check block health before fsck or xfs_repair?"
      a: "Repair on failing storage can worsen corruption and destroy recoverable data."
    - q: "What is md RAID?"
      a: "Linux software RAID managed by mdadm."
    - q: "Why is RAID not backup?"
      a: "It does not protect against deletion, corruption, ransomware, or many operator mistakes."
    - q: "What is device mapper?"
      a: "A kernel framework for mapping one or more block devices into virtual block devices."
    - q: "Why back up a LUKS header?"
      a: "If the header is lost, encrypted data may be unrecoverable even when raw blocks remain."
    - q: "What does multipath protect against?"
      a: "Failure of individual I/O paths to the same storage volume, not failure of the volume itself."
    - q: "What does iostat help identify?"
      a: "Storage throughput, latency, queueing, and saturation trends."
    - q: "Why collect SMART or NVMe health data?"
      a: "It can show media errors, wear, temperature, unsafe shutdowns, and device warnings during incidents."
    - q: "Why use fstrim on SSD or thin storage?"
      a: "It returns unused blocks when discard is supported through the stack."
    - q: "What is a mount namespace?"
      a: "An isolated view of the mount tree for a process or group of processes."
    - q: "What does /proc/PID/mountinfo show?"
      a: "The mount tree visible to that specific process, including namespace-specific mount details."
    - q: "What is mount propagation?"
      a: "Rules controlling whether mount and unmount events flow between related mount trees."
    - q: "What is a bind mount?"
      a: "A mount that exposes an existing path at another path without copying data."
    - q: "What is a Unix domain socket?"
      a: "A local IPC socket, often represented by a filesystem path, used for communication between processes on the same host."
    - q: "Why can a Unix socket fail from permissions?"
      a: "Path-based Unix sockets rely on socket file permissions and parent directory execute permissions."
    - q: "What does ss -x show?"
      a: "Unix domain socket state and, when available, owning process and path information."
    - q: "Why do sockets show up as file descriptor problems?"
      a: "Sockets consume process file descriptors and appear under /proc/PID/fd."
    - q: "What is a Linux TID?"
      a: "A thread ID identifying an individual task inside a process or thread group."
    - q: "Where are a process's threads visible in procfs?"
      a: "Under /proc/PID/task."
    - q: "What does top -H show?"
      a: "A thread-level view of CPU usage inside processes."
    - q: "Why is PID 1 special in containers?"
      a: "It receives orphaned children and must handle signals and reaping for clean process lifecycle."
    - q: "What is NAPI?"
      a: "The Linux networking event handling mechanism that lets drivers use batched polling instead of interrupting for every packet."
    - q: "Why does softirq matter for network performance?"
      a: "Network receive and transmit completion work often runs in softirq context, so high softirq CPU can be packet-processing load."
    - q: "What does RPS do?"
      a: "Receive Packet Steering spreads kernel receive processing across configured CPUs."
    - q: "What does RFS add beyond RPS?"
      a: "Receive Flow Steering tries to process packets on the CPU where the consuming application thread is running."
    - q: "What does XPS do?"
      a: "Transmit Packet Steering selects transmit queues based on CPU or receive-queue affinity."
    - q: "Why inspect NIC rings?"
      a: "RX or TX ring drops can show the driver or hardware queue is not being drained fast enough."
    - q: "What can offloads such as GSO and GRO change?"
      a: "They reduce per-packet CPU cost by segmenting or coalescing packets, but can make captures look different from wire packets."
    - q: "What does net.core.somaxconn cap?"
      a: "The maximum listen backlog accepted from applications."
    - q: "What does tcp_max_syn_backlog control?"
      a: "The queue for half-open TCP handshakes before they become established connections."
    - q: "Why does ip_local_port_range matter?"
      a: "It defines the ephemeral local port range available for outbound connections."
    - q: "Why is TIME_WAIT useful?"
      a: "It prevents delayed packets from an old TCP connection from corrupting a later connection using the same tuple."
    - q: "What can a full conntrack table do?"
      a: "It can cause new stateful connections or NAT flows to fail while some existing flows continue."
    - q: "What does systemd-networkd manage?"
      a: "Network links that match .network files, plus virtual devices described by .netdev files."
    - q: "What is network-online.target for?"
      a: "It represents a network manager's decision that the network is online, usually through a wait-online service."
    - q: "Why can systemd-networkd-wait-online delay boot?"
      a: "It may wait for required managed interfaces that are unplugged, optional, or misconfigured."
    - q: "What is systemd socket activation?"
      a: "systemd owns a socket and activates the matching service when traffic or activity arrives."
    - q: "What does Accept=yes mean in a .socket unit?"
      a: "systemd starts one templated service instance for each accepted connection."
    - q: "What does IPAccounting do?"
      a: "It makes systemd account IP traffic for a unit."
    - q: "What does PrivateNetwork do?"
      a: "It gives a systemd service a private network namespace."
kubernetes:
  cards:
    - q: "What is the Kubernetes API server?"
      a: "The front door for cluster state, handling auth, validation, admission, persistence, and watches."
    - q: "What does etcd store?"
      a: "The persistent Kubernetes API state."
    - q: "What does the scheduler do?"
      a: "It selects a node for Pods that do not already have a node assignment."
    - q: "What does the kubelet do?"
      a: "It runs on each node and reconciles assigned Pods with the container runtime."
    - q: "What is a controller?"
      a: "A reconciliation loop that moves observed state toward desired state."
    - q: "What is a Pod?"
      a: "The smallest deployable Kubernetes workload unit, sharing network and storage context across its containers."
    - q: "What does a ReplicaSet maintain?"
      a: "A desired number of matching Pod replicas."
    - q: "Why use a Deployment?"
      a: "It manages ReplicaSets and provides declarative rollout and rollback behavior."
    - q: "Why use a StatefulSet?"
      a: "It provides stable identities, ordered operations, and persistent storage patterns for stateful workloads."
    - q: "What is a DaemonSet?"
      a: "A controller that runs a Pod on selected nodes, often for agents or node services."
    - q: "What is a Job?"
      a: "A workload that runs Pods to completion."
    - q: "What is a CronJob?"
      a: "A scheduled controller that creates Jobs at configured times."
    - q: "What is the difference between spec and status?"
      a: "Spec is desired state; status is observed state reported by controllers or agents."
    - q: "What is a finalizer?"
      a: "A key that blocks deletion until a controller performs cleanup."
    - q: "What does a readiness probe affect?"
      a: "Whether a Pod endpoint receives Service traffic."
    - q: "What does a liveness probe affect?"
      a: "Whether kubelet restarts a container considered unhealthy."
    - q: "What does a startup probe protect?"
      a: "Slow-starting containers from premature liveness failures."
    - q: "What is a Service?"
      a: "A stable virtual access point for a changing set of Pod endpoints."
    - q: "What is a ClusterIP Service?"
      a: "An internal virtual IP reachable inside the cluster."
    - q: "What is a NodePort Service?"
      a: "A Service exposed on a port on each selected node."
    - q: "What is a LoadBalancer Service?"
      a: "A Service that asks infrastructure integration to provision an external load balancer."
    - q: "What is a headless Service?"
      a: "A Service with clusterIP None that publishes endpoints directly."
    - q: "What does CoreDNS do in Kubernetes?"
      a: "It answers cluster DNS names and forwards other queries based on configuration."
    - q: "What is a CNI plugin?"
      a: "A networking implementation that creates Pod network interfaces and routes traffic."
    - q: "What does NetworkPolicy require?"
      a: "A CNI plugin that implements policy enforcement."
    - q: "What is Ingress?"
      a: "An API for HTTP routing that requires an Ingress controller."
    - q: "What is Gateway API?"
      a: "A newer, role-oriented set of APIs for L4 and L7 traffic routing."
    - q: "What is a PersistentVolume?"
      a: "A cluster storage resource representing actual storage."
    - q: "What is a PersistentVolumeClaim?"
      a: "A user's request for storage that can bind to a PersistentVolume."
    - q: "What is a StorageClass?"
      a: "A policy for dynamic volume provisioning."
    - q: "What is CSI?"
      a: "The Container Storage Interface, used by storage vendors to integrate with Kubernetes."
    - q: "What is a VolumeAttachment?"
      a: "An object representing attachment of a CSI volume to a node."
    - q: "What does kubeadm upgrade plan show?"
      a: "Available upgrade targets and component upgrade guidance for a kubeadm cluster."
    - q: "Why drain a node?"
      a: "To evict workloads before maintenance while respecting scheduling and disruption rules."
    - q: "What is a PodDisruptionBudget?"
      a: "A policy limiting voluntary disruptions to maintain availability."
    - q: "What is a taint?"
      a: "A node property that repels Pods without matching tolerations."
    - q: "What is a toleration?"
      a: "A Pod setting allowing scheduling onto a node with a matching taint."
    - q: "What is a node affinity?"
      a: "A scheduling rule expressing preferred or required node properties."
    - q: "What are requests?"
      a: "Resources used by the scheduler to place Pods and by QoS classification."
    - q: "What are limits?"
      a: "Resource ceilings enforced by runtime or kernel mechanisms."
    - q: "What is a namespace?"
      a: "A logical scope for names, access policies, and some resource quotas."
    - q: "What is RBAC?"
      a: "Role-based access control using Roles, ClusterRoles, RoleBindings, and ClusterRoleBindings."
    - q: "What is admission control?"
      a: "API-server plugins or webhooks that mutate or validate requests after auth and before persistence."
    - q: "What is a CRD?"
      a: "A CustomResourceDefinition that extends the Kubernetes API with a new resource type."
    - q: "What is an operator?"
      a: "A controller that manages an application or platform component through custom resources."
    - q: "What does kubectl describe help with?"
      a: "It summarizes object state, events, and controller feedback for troubleshooting."
    - q: "What does ImagePullBackOff mean?"
      a: "The kubelet cannot pull the container image and is backing off retries."
    - q: "What does CrashLoopBackOff mean?"
      a: "A container repeatedly exits and kubelet is delaying restarts."
    - q: "Why inspect events?"
      a: "Events often show scheduling, image pull, mount, probe, or admission failures."
    - q: "What is version skew policy?"
      a: "Rules defining supported version differences between Kubernetes components."
    - q: "What is the fully qualified DNS name for a Service?"
      a: "service.namespace.svc.cluster.local in the default cluster domain."
    - q: "What does dnsPolicy: ClusterFirst usually do?"
      a: "It sends cluster-domain lookups to cluster DNS and forwards external names through the cluster DNS path."
    - q: "Why can CoreDNS return stale or failing answers?"
      a: "RBAC, API watch problems, forwarding loops, upstream failures, cache behavior, load, or NetworkPolicy can affect it."
    - q: "What does ndots:5 mean for Pods?"
      a: "Names with fewer than five dots may be tried with cluster search suffixes before an absolute lookup."
    - q: "What is an EndpointSlice?"
      a: "A scalable Kubernetes object listing Service backend endpoints and conditions."
    - q: "What endpoint condition usually maps to Pod readiness?"
      a: "The ready condition, with serving and terminating adding more detail for endpoint consumers."
    - q: "What does kube-proxy watch for Service routing?"
      a: "Services and EndpointSlices."
    - q: "What can replace kube-proxy behavior?"
      a: "A CNI or datapath implementation using eBPF, IPVS, nftables, iptables, or another Service proxy mechanism."
    - q: "Why can same-node Pod traffic work while cross-node fails?"
      a: "Cross-node traffic exercises routing, encapsulation, cloud paths, firewalls, and MTU that same-node traffic may avoid."
    - q: "What is hostNetwork?"
      a: "A Pod setting that makes the Pod share the node network namespace instead of normal Pod networking."
    - q: "What makes NetworkPolicy enforcement real?"
      a: "A CNI plugin that implements NetworkPolicy."
    - q: "How do NetworkPolicy rules combine?"
      a: "They are additive; if any applicable policy allows a flow, that flow is allowed."
    - q: "What is a default-deny egress pitfall?"
      a: "DNS breaks unless UDP and TCP 53 to the intended DNS endpoints are allowed."
    - q: "What is ingressClassName?"
      a: "The field that selects which Ingress controller should handle an Ingress."
    - q: "What are GatewayClass, Gateway, and HTTPRoute?"
      a: "Gateway API resources that separate implementation class, infrastructure entry point, and application HTTP routing."
    - q: "Why inspect Ingress or Gateway status conditions?"
      a: "They show whether a controller accepted, attached, programmed, or rejected the route and listener configuration."
    - q: "What does ExternalDNS do?"
      a: "It watches Kubernetes resources and reconciles matching DNS records through a DNS provider API."
    - q: "Is ExternalDNS the same as CoreDNS?"
      a: "No. CoreDNS answers cluster DNS queries; ExternalDNS manages authoritative DNS provider records."
    - q: "What Kubernetes sources can ExternalDNS watch?"
      a: "Common sources include Services, Ingresses, Gateway API resources, and DNSEndpoint custom resources."
    - q: "Why use a TXT registry with ExternalDNS?"
      a: "It stores ownership metadata so controllers and clusters do not overwrite each other's records."
    - q: "What should --txt-owner-id be?"
      a: "A stable unique owner ID for the ExternalDNS instance or cluster that owns the records."
    - q: "What does --domain-filter do?"
      a: "It limits which DNS names and zones ExternalDNS considers for reconciliation."
    - q: "What does external-dns.alpha.kubernetes.io/hostname do?"
      a: "It declares hostnames for ExternalDNS to manage when the source needs explicit DNS names."
    - q: "What is the risk of --policy=sync?"
      a: "It can delete provider records that are no longer desired, so ownership and filters must be correct."
    - q: "Why might ExternalDNS wait before creating a record?"
      a: "The Service, Ingress, or Gateway may not have a usable status target yet."
    - q: "Why does split-horizon DNS matter for ExternalDNS?"
      a: "The same name can exist in public and private zones, so zone filters and client resolver paths must be intentional."
dns:
  cards:
    - q: "What is DNS?"
      a: "A distributed naming system that maps names to records such as addresses, mail exchangers, and service metadata."
    - q: "What is an authoritative nameserver?"
      a: "A server that serves official data for a DNS zone."
    - q: "What is a recursive resolver?"
      a: "A resolver that performs lookups on behalf of clients and caches the answers."
    - q: "What is a stub resolver?"
      a: "Client-side resolver code that sends DNS questions to a recursive resolver."
    - q: "What does an A record contain?"
      a: "An IPv4 address for a name."
    - q: "What does an AAAA record contain?"
      a: "An IPv6 address for a name."
    - q: "What does a CNAME record do?"
      a: "It aliases one name to another canonical name."
    - q: "What does an MX record identify?"
      a: "Mail exchangers for a domain."
    - q: "What does an NS record identify?"
      a: "Authoritative nameservers for a zone."
    - q: "What does an SOA record contain?"
      a: "Zone authority metadata including serial, refresh, retry, expire, and negative caching timing."
    - q: "What is TTL?"
      a: "The time a resolver may cache a DNS answer."
    - q: "What is negative caching?"
      a: "Caching of nonexistence answers such as NXDOMAIN or NODATA."
    - q: "What is NXDOMAIN?"
      a: "A response saying the queried name does not exist."
    - q: "What is NODATA?"
      a: "A response saying the name exists but has no record of the requested type."
    - q: "What is delegation?"
      a: "Handing authority for a child zone to nameservers named by NS records."
    - q: "What is glue?"
      a: "Address records in a parent zone that help resolvers reach in-bailiwick child nameservers."
    - q: "What is the root zone?"
      a: "The top of the DNS hierarchy that delegates top-level domains."
    - q: "What is a TLD?"
      a: "A top-level domain such as com, org, net, or a country-code domain."
    - q: "Why use dig +trace?"
      a: "It follows delegation from the root down to show where a resolution path changes."
    - q: "Why query an authoritative server directly?"
      a: "It separates source-of-truth data from recursive caching behavior."
    - q: "What does DNSSEC provide?"
      a: "Data origin authentication and integrity for signed DNS data."
    - q: "Does DNSSEC encrypt queries?"
      a: "No. DNSSEC validates data but does not hide the query."
    - q: "What is a DS record?"
      a: "A parent-zone record that links delegation to a child zone DNSSEC key."
    - q: "What is split-horizon DNS?"
      a: "Different DNS answers for the same name depending on client location or resolver view."
    - q: "What is a wildcard record?"
      a: "A record that synthesizes answers for otherwise nonexistent names under a zone."
    - q: "Why can CNAME at zone apex be problematic?"
      a: "The apex must also hold SOA and NS records, and standard DNS does not allow CNAME alongside other data."
    - q: "What is an ALIAS or ANAME?"
      a: "Provider-specific apex flattening that returns address records while tracking another name."
    - q: "What does EDNS add?"
      a: "Extensions such as larger UDP payloads and option signaling."
    - q: "Why can DNS fall back to TCP?"
      a: "Responses may be truncated or require reliable transport, especially with large answers or DNSSEC."
    - q: "What is SERVFAIL?"
      a: "A failure response indicating the resolver could not complete the lookup successfully."
    - q: "What does REFUSED mean?"
      a: "The server refuses to answer the query, often due to policy or recursion restrictions."
    - q: "What is recursion desired?"
      a: "A query flag asking a resolver to perform recursive resolution."
    - q: "What is recursion available?"
      a: "A response flag indicating the server provides recursion."
    - q: "What is a search domain?"
      a: "A suffix appended to relative names by client resolver behavior."
    - q: "What does ndots affect?"
      a: "Whether a name is tried through search domains before absolute lookup."
    - q: "Why can Kubernetes DNS generate many queries?"
      a: "Pod search paths plus high ndots can expand short or external names through multiple suffixes."
    - q: "What does CoreDNS do?"
      a: "It serves Kubernetes DNS records and can forward non-cluster queries upstream."
    - q: "What is kube-dns historically?"
      a: "The older Kubernetes DNS service name and implementation lineage before CoreDNS became common."
    - q: "What is DNS propagation really?"
      a: "Mostly waiting for cached answers to expire according to TTL and resolver policy."
    - q: "Why lower TTL before migration?"
      a: "To reduce cache lifetime before changing authoritative data."
    - q: "What is a lame delegation?"
      a: "A delegation to a nameserver that is not authoritative for the child zone."
    - q: "What does qname minimization do?"
      a: "It reduces how much of the queried name is sent to each delegation layer."
    - q: "What is DNS over TLS?"
      a: "DNS transported over TLS, commonly on port 853."
    - q: "What is DNS over HTTPS?"
      a: "DNS queries transported over HTTPS."
    - q: "What does round-robin DNS do?"
      a: "It returns multiple records in changing order, but does not provide real health-aware load balancing by itself."
    - q: "Why check both UDP and TCP 53?"
      a: "Firewalls or network paths can break one transport while the other still works."
    - q: "What does dig +short hide?"
      a: "Status, authority, flags, and additional troubleshooting context."
    - q: "Why inspect the SOA serial?"
      a: "It shows whether authoritative nameservers have the same zone version."
    - q: "What is a PTR record?"
      a: "A reverse-DNS mapping from an IP address name to a hostname."
    - q: "What is a TXT record often used for?"
      a: "Domain verification, SPF, DKIM-related data, and other text metadata."
    - q: "What is NODATA?"
      a: "A NOERROR response where the queried name exists but has no records of the requested type."
    - q: "What does SERVFAIL usually mean?"
      a: "The resolver or server failed to complete the query, often due to DNSSEC, upstream timeout, lame delegation, or policy."
    - q: "What does REFUSED usually mean?"
      a: "The server understood the query but refuses to answer, commonly because of recursion or access policy."
    - q: "What does EDNS help with?"
      a: "It extends DNS with option signaling and larger advertised UDP payload sizes."
    - q: "What does the DNS TC flag mean?"
      a: "The response was truncated and the client should retry with TCP."
    - q: "Why does large DNS often expose network bugs?"
      a: "DNSSEC, large TXT records, EDNS, fragmentation, TCP fallback, and blocked ICMP can all affect large responses."
    - q: "What can a CAA record control?"
      a: "Which certificate authorities are allowed to issue certificates for a domain."
    - q: "Why is reverse DNS separate from forward DNS?"
      a: "PTR records live in separately delegated reverse zones under in-addr.arpa or ip6.arpa."
    - q: "What is a domain controller?"
      a: "An identity authority for a directory domain that handles authentication, directory access, policy, and replication."
    - q: "What is AD DS?"
      a: "Active Directory Domain Services, Microsoft's directory service for domain identity, policy, and authentication."
    - q: "Why do Active Directory clients need DNS SRV records?"
      a: "They discover domain controllers, Kerberos KDCs, LDAP services, Global Catalog servers, and site-local targets through SRV records."
    - q: "What is _msdcs?"
      a: "A Microsoft directory-services DNS namespace containing important domain controller locator records."
    - q: "What does _ldap._tcp.dc._msdcs identify?"
      a: "LDAP-capable domain controllers for a domain."
    - q: "What does _kerberos._tcp identify?"
      a: "Kerberos KDC service records for a domain."
    - q: "What is the Global Catalog?"
      a: "A partial forest-wide index held by selected domain controllers for searches and some logon scenarios."
    - q: "Why does Kerberos require good time sync?"
      a: "Kerberos tickets are time-bound, so excessive clock skew can make authentication fail."
    - q: "What are FSMO roles?"
      a: "Special Active Directory operations roles such as PDC Emulator, RID Master, Schema Master, Domain Naming Master, and Infrastructure Master."
    - q: "What can break domain controller discovery?"
      a: "Wrong client DNS resolvers, missing SRV records, broken _msdcs data, stale records, site mapping errors, or blocked LDAP/Kerberos paths."
networking:
  cards:
    - q: "What does a NIC do?"
      a: "It connects a host to a network link and handles frame transmission and reception."
    - q: "What is a MAC address?"
      a: "A link-layer address used on local network segments."
    - q: "What does ARP resolve?"
      a: "IPv4 addresses to MAC addresses on a local link."
    - q: "What does Neighbor Discovery do?"
      a: "IPv6 neighbor resolution, router discovery, and related link-local functions."
    - q: "What is an IP address?"
      a: "A network-layer address used for routing packets between networks."
    - q: "What is a subnet mask?"
      a: "The boundary between network prefix bits and host bits."
    - q: "What is CIDR?"
      a: "Classless Inter-Domain Routing notation such as 10.0.0.0/24."
    - q: "What is a default gateway?"
      a: "The next hop used when no more-specific route matches."
    - q: "What route wins?"
      a: "The most specific matching prefix, also called longest-prefix match."
    - q: "What is MTU?"
      a: "The largest packet size a link can carry without fragmentation at that layer."
    - q: "What is Path MTU Discovery?"
      a: "A process for discovering the smallest MTU along a path."
    - q: "Why can large packets fail while pings work?"
      a: "MTU or ICMP filtering can break larger packets while small packets still pass."
    - q: "What does TCP provide?"
      a: "Reliable ordered byte streams with retransmission, flow control, and congestion control."
    - q: "What does UDP provide?"
      a: "Connectionless datagrams without built-in reliability or ordering."
    - q: "What is a TCP handshake?"
      a: "SYN, SYN-ACK, ACK establishment of connection state."
    - q: "What is a TCP retransmission?"
      a: "A sender resends data it believes was lost or unacknowledged."
    - q: "What is flow control?"
      a: "Receiver-side control of how much data the sender may have in flight."
    - q: "What is congestion control?"
      a: "Sender-side adaptation to network capacity and loss signals."
    - q: "What is NAT?"
      a: "Translation of packet addresses or ports between network realms."
    - q: "What is SNAT?"
      a: "Source address or port translation."
    - q: "What is DNAT?"
      a: "Destination address or port translation."
    - q: "What does a NAT gateway usually do?"
      a: "It lets private workloads initiate outbound connections through translated shared egress addresses."
    - q: "What is PAT or NAPT?"
      a: "Port Address Translation, where many internal flows share an external IP by using different source ports."
    - q: "Why can NAT gateways exhaust ports?"
      a: "Many flows sharing the same translated source IP and destination tuple can consume available source port mappings."
    - q: "What is hairpin NAT?"
      a: "An internal client reaches an internal service through the service's external NAT address."
    - q: "Why can NAT break source allow lists?"
      a: "The destination sees the translated gateway, node, or egress IP instead of the original client address."
    - q: "Why are private service endpoints useful with NAT?"
      a: "They can avoid NAT for provider services, reducing cost, preserving private routing, and lowering port pressure."
    - q: "How does DNS affect NAT usage?"
      a: "The DNS answer determines whether traffic targets a private address, public address, ClusterIP, or endpoint that may require NAT."
    - q: "Why can split-horizon DNS avoid hairpin NAT?"
      a: "Internal clients receive private answers instead of public addresses that loop back through NAT."
    - q: "Why can CoreDNS increase NAT gateway load?"
      a: "External forwarding, ndots search expansion, retries, and shared upstream resolvers can create many DNS flows through NAT."
    - q: "What is conntrack?"
      a: "Kernel connection tracking used by NAT and stateful firewalls."
    - q: "What is a firewall?"
      a: "Policy that permits, denies, or transforms traffic based on packet or connection attributes."
    - q: "What is a load balancer?"
      a: "A system that distributes client traffic across backend targets."
    - q: "What is L4 load balancing?"
      a: "Balancing based on transport-layer data such as IPs and ports."
    - q: "What is L7 load balancing?"
      a: "Balancing based on application-layer data such as HTTP host or path."
    - q: "What is TLS termination?"
      a: "Ending a TLS connection at a proxy or load balancer before forwarding traffic onward."
    - q: "What is a VLAN?"
      a: "A link-layer segmentation mechanism using tags on Ethernet frames."
    - q: "What is VXLAN?"
      a: "An overlay encapsulation that carries layer-2 frames over UDP/IP."
    - q: "What is BGP?"
      a: "A path-vector routing protocol used between autonomous systems and inside some data centers."
    - q: "What is OSPF?"
      a: "A link-state interior routing protocol."
    - q: "What is ICMP used for?"
      a: "Control messages such as echo, destination unreachable, and fragmentation-needed signals."
    - q: "Why can blocking ICMP hurt TCP?"
      a: "It can break Path MTU Discovery and make large flows stall."
    - q: "What does ping test?"
      a: "Basic ICMP reachability and round-trip time, not application availability."
    - q: "What does traceroute show?"
      a: "Likely layer-3 hops toward a destination, subject to routing and filtering behavior."
    - q: "What does tcpdump capture?"
      a: "Packets visible on an interface or capture point."
    - q: "What does ss show?"
      a: "Socket state, listeners, queues, and connection details."
    - q: "What does ip route show?"
      a: "The kernel routing table."
    - q: "What does ip neigh show?"
      a: "Neighbor table entries such as ARP or IPv6 ND mappings."
    - q: "What is asymmetric routing?"
      a: "Traffic takes different forward and return paths."
    - q: "Why does asymmetric routing matter?"
      a: "Stateful firewalls, NAT, and troubleshooting assumptions can fail when paths differ."
    - q: "What is DNS used for in networking incidents?"
      a: "It separates naming failures from routing, firewall, or application failures."
    - q: "What is a socket?"
      a: "An endpoint for network or local IPC communication."
    - q: "What is a listen backlog?"
      a: "Queue capacity for pending inbound connections."
    - q: "What is ephemeral port exhaustion?"
      a: "A host runs out of temporary source ports for outbound connections."
    - q: "What is TIME_WAIT?"
      a: "A TCP state that keeps connection identity around after close to handle delayed packets."
    - q: "What is packet loss?"
      a: "Packets are dropped before reaching their destination or before acknowledgment."
    - q: "What is jitter?"
      a: "Variation in packet delay over time."
    - q: "What is bandwidth?"
      a: "The amount of data that can be transmitted per unit time."
    - q: "What is latency?"
      a: "The time it takes data to travel from source to destination and often back."
    - q: "What does ip route get reveal?"
      a: "The route, source address, egress interface, and next hop Linux would use for a destination."
    - q: "Why are overlapping private ranges dangerous?"
      a: "They can make VPN, VPC, Pod, Service, and on-prem routes ambiguous or unreachable."
    - q: "Why is /64 common in IPv6 subnets?"
      a: "Many IPv6 mechanisms, including common SLAAC assumptions, expect a /64 on a link."
    - q: "What is ICMPv6 required for?"
      a: "Neighbor Discovery, router discovery, packet-too-big messages, and other IPv6 control behavior."
    - q: "What does tracepath help reveal?"
      a: "Likely path hops and path MTU information without requiring raw socket privileges on many systems."
    - q: "Why can UDP be hard to debug?"
      a: "There is no handshake or built-in delivery confirmation, so drops may only be visible in captures or application timeouts."
    - q: "What is QUIC?"
      a: "An encrypted transport over UDP that provides streams, loss recovery, congestion control, and connection migration."
    - q: "What is HTTP/3?"
      a: "HTTP semantics carried over QUIC instead of TCP."
    - q: "Why can load balancer health checks lie?"
      a: "They may test only a shallow port or path that differs from real user traffic and dependencies."
    - q: "What is the PROXY protocol used for?"
      a: "Passing original client connection metadata from a proxy or load balancer to a backend."
    - q: "Why is X-Forwarded-For risky?"
      a: "Clients can forge it unless trusted edge proxies sanitize and set it."
    - q: "Why do proxy timeout budgets matter?"
      a: "Mismatched client, load balancer, proxy, backend, and dependency timeouts can create confusing partial failures."
    - q: "What is IPsec tunnel mode?"
      a: "An IPsec mode that encapsulates the entire original IP packet inside ESP with a new outer IP header."
    - q: "What does IKEv2 negotiate?"
      a: "Peer authentication, cryptographic proposals, keys, and Child SAs for protected data traffic."
    - q: "What is NAT-T?"
      a: "IPsec NAT traversal, commonly encapsulating ESP so NAT devices can track it over UDP 4500."
    - q: "What are IPsec traffic selectors?"
      a: "Rules describing which source and destination addresses, protocols, and ports should be protected by a Child SA."
    - q: "What is a route-based VPN?"
      a: "A VPN design where routes send traffic into a tunnel or XFRM interface instead of relying only on policy selectors."
    - q: "What is split tunneling?"
      a: "Sending only selected destinations through the VPN while other traffic uses the normal local path."
    - q: "Why do VPNs often need MTU testing?"
      a: "Encapsulation adds headers, so the effective payload MTU is smaller and broken PMTUD can stall large packets."
    - q: "What is netfilter?"
      a: "The Linux kernel packet filtering and NAT hook framework used by nftables and iptables."
    - q: "What is the difference between INPUT and FORWARD?"
      a: "INPUT handles packets destined for the local host; FORWARD handles packets routed through the host."
    - q: "Why does firewall rule order matter?"
      a: "Rules are evaluated in order, so earlier broad matches can override later specific policy."
    - q: "What is nftables?"
      a: "The modern Linux packet classification framework and nft userspace tool that replaces many iptables-family tools."
    - q: "Why check conntrack during firewall incidents?"
      a: "Stateful firewall and NAT behavior depend on tracked flows, and a full table can break new connections."
    - q: "What is a forward proxy?"
      a: "A proxy used by clients for outbound access to origin servers, often for egress policy, auth, or auditing."
    - q: "What is a reverse proxy?"
      a: "A proxy that clients reach as the service endpoint while it forwards to backend services."
    - q: "What does HTTP CONNECT do?"
      a: "It asks an HTTP proxy to establish a TCP tunnel to a host and port."
    - q: "What does NO_PROXY control?"
      a: "Destinations that a client should access directly instead of through a configured proxy."
    - q: "Why is TLS interception operationally risky?"
      a: "It changes the certificate trust boundary and can break clients, mTLS, SNI, ALPN, or compliance assumptions."
postgres:
  cards:
    - q: "What is PostgreSQL?"
      a: "A relational database with transactional storage, SQL execution, extensibility, and strong consistency features."
    - q: "What does a database cluster mean in PostgreSQL?"
      a: "A data directory managed by one PostgreSQL server instance containing databases and shared catalogs."
    - q: "What is MVCC?"
      a: "Multi-Version Concurrency Control, where transactions see snapshots of row versions."
    - q: "Why does MVCC help concurrency?"
      a: "Readers and writers can often proceed without blocking each other."
    - q: "What is a tuple?"
      a: "A physical row version stored in a table."
    - q: "Why does PostgreSQL need vacuum?"
      a: "Vacuum removes dead tuples, updates visibility metadata, and helps prevent transaction ID wraparound."
    - q: "What is autovacuum?"
      a: "Background workers that automatically vacuum and analyze tables based on thresholds."
    - q: "What is transaction ID wraparound?"
      a: "A failure risk when old transaction IDs are not frozen before the finite ID space cycles."
    - q: "What is WAL?"
      a: "Write-Ahead Logging used for durability, crash recovery, replication, and PITR."
    - q: "What is a checkpoint?"
      a: "A point where dirty buffers are flushed so crash recovery can start from a known position."
    - q: "What is shared_buffers?"
      a: "PostgreSQL's internal buffer cache for table and index pages."
    - q: "What is work_mem?"
      a: "Memory allowed per sort, hash, or similar operation before spilling."
    - q: "Why can work_mem be dangerous?"
      a: "It can be used many times per query and per session, multiplying memory use."
    - q: "What does EXPLAIN show?"
      a: "The query plan chosen by the planner without executing the query."
    - q: "What does EXPLAIN ANALYZE add?"
      a: "Actual execution timing, row counts, and runtime behavior."
    - q: "What are planner estimates?"
      a: "Predictions of rows and costs based on statistics."
    - q: "What does ANALYZE update?"
      a: "Table statistics used by the planner."
    - q: "What is a sequential scan?"
      a: "A table scan that reads rows directly rather than using an index path."
    - q: "What is a B-tree index good for?"
      a: "Equality and ordered range lookups for many common data types."
    - q: "What is a partial index?"
      a: "An index covering only rows that match a predicate."
    - q: "What is a covering index?"
      a: "An index that includes enough columns to satisfy a query with little or no heap access."
    - q: "What is index bloat?"
      a: "Wasted index space from old versions and page splits that can hurt performance."
    - q: "What is a transaction?"
      a: "A unit of work with atomicity, consistency, isolation, and durability properties."
    - q: "What is read committed?"
      a: "The default isolation level where each statement sees a fresh committed snapshot."
    - q: "What is repeatable read?"
      a: "An isolation level where a transaction sees a stable snapshot."
    - q: "What is serializable?"
      a: "The strongest isolation level, detecting dangerous concurrency patterns and aborting some transactions."
    - q: "What is a lock wait?"
      a: "A backend waiting for another transaction or process to release a conflicting lock."
    - q: "What is deadlock detection?"
      a: "PostgreSQL detects lock cycles and aborts one participant."
    - q: "What is replication?"
      a: "Copying WAL changes from a primary to standby servers."
    - q: "What is streaming replication?"
      a: "Continuous WAL streaming from primary to standby."
    - q: "What is synchronous replication?"
      a: "A mode where commits wait for configured standbys to confirm WAL receipt or replay."
    - q: "What is replication lag?"
      a: "Delay between primary WAL generation and standby receipt, replay, or visibility."
    - q: "What is a physical base backup?"
      a: "A filesystem-level copy of the data directory coordinated with WAL."
    - q: "What is PITR?"
      a: "Point-in-time recovery using a base backup plus archived WAL to recover to a target time."
    - q: "What is logical replication?"
      a: "Replication of row changes through publications and subscriptions."
    - q: "What is a connection pooler?"
      a: "A service such as PgBouncer that reuses database connections for clients."
    - q: "Why use PgBouncer?"
      a: "To reduce backend connection overhead and protect PostgreSQL from excessive sessions."
    - q: "What is a schema?"
      a: "A namespace inside a database for tables, functions, types, and other objects."
    - q: "What is a role?"
      a: "A database identity used for login, permissions, and ownership."
    - q: "What is least privilege?"
      a: "Grant only the permissions a role needs to perform its work."
    - q: "What is CloudNativePG?"
      a: "A Kubernetes operator for managing PostgreSQL clusters."
    - q: "What resource represents a CloudNativePG cluster?"
      a: "A Cluster custom resource in the postgresql.cnpg.io API group."
    - q: "What is the -rw Service in CloudNativePG?"
      a: "A Service that points applications at the current primary for writes."
    - q: "What is failover?"
      a: "Unplanned promotion of a standby when the primary fails."
    - q: "What is switchover?"
      a: "A planned role transition, usually for maintenance."
    - q: "Why archive WAL?"
      a: "Archived WAL enables PITR and recovery beyond what remains in pg_wal."
    - q: "What is Barman Cloud used for?"
      a: "Object-storage-backed PostgreSQL backups and WAL archives in CloudNativePG deployments."
    - q: "Why test restores?"
      a: "Backups are only proven useful when a restore path is validated."
    - q: "What does pg_stat_activity show?"
      a: "Active sessions, queries, waits, transaction state, and backend metadata."
    - q: "What does pg_stat_replication show?"
      a: "Replication sender state and lag details for connected standbys."
ceph:
  cards:
    - q: "What is Ceph?"
      a: "A distributed storage system providing object, block, and file interfaces on top of RADOS."
    - q: "What is RADOS?"
      a: "Reliable Autonomic Distributed Object Store, the object storage layer at Ceph's core."
    - q: "What does a MON do?"
      a: "A monitor maintains cluster maps, quorum, and authoritative cluster state."
    - q: "What does a MGR do?"
      a: "A manager provides modules, metrics, dashboard, orchestration interfaces, and operational services."
    - q: "What does an OSD do?"
      a: "It stores data, replicates or erasure-codes objects, recovers, scrubs, and reports health."
    - q: "What does an MDS do?"
      a: "It manages metadata for CephFS."
    - q: "What does RGW provide?"
      a: "S3-compatible and Swift-compatible object gateway access."
    - q: "What does RBD provide?"
      a: "Block devices backed by RADOS objects."
    - q: "What does CephFS provide?"
      a: "A shared filesystem backed by RADOS with metadata served by MDS daemons."
    - q: "What is a pool?"
      a: "A logical namespace defining placement groups, redundancy, and CRUSH placement policy."
    - q: "What is a placement group?"
      a: "A shard of a pool used to group objects for placement, recovery, and state tracking."
    - q: "What is CRUSH?"
      a: "Ceph's placement algorithm that maps data to OSDs using a topology-aware map."
    - q: "Why does CRUSH matter?"
      a: "It lets clients and daemons calculate placement without a central lookup for every object."
    - q: "What is a failure domain?"
      a: "A topology level such as host, rack, or zone across which replicas should be spread."
    - q: "What is replication?"
      a: "Storing multiple full copies of data on different OSDs."
    - q: "What is erasure coding?"
      a: "Splitting data into data and coding chunks to reduce overhead while tolerating failures."
    - q: "What does ceph -s show?"
      a: "A concise cluster status including health, services, data, IO, and progress."
    - q: "What does ceph health detail add?"
      a: "Specific health warnings or errors and often the objects, daemons, or PGs involved."
    - q: "What is HEALTH_OK?"
      a: "Ceph currently sees no health checks requiring attention."
    - q: "What is HEALTH_WARN?"
      a: "Ceph detected a condition needing operator attention but not necessarily immediate outage."
    - q: "What is HEALTH_ERR?"
      a: "Ceph detected a serious condition that can threaten availability or data safety."
    - q: "What is an active+clean PG?"
      a: "A placement group that is available and has all expected replicas or chunks clean."
    - q: "What is a degraded PG?"
      a: "A PG missing one or more expected replicas or chunks."
    - q: "What is an undersized PG?"
      a: "A PG with fewer acting OSDs than the pool requires."
    - q: "What is a stale PG?"
      a: "A PG whose hosting OSDs have not reported current state to monitors."
    - q: "What is backfill?"
      a: "Data movement to bring new or changed OSD placement up to date."
    - q: "What is recovery?"
      a: "Reconstructing missing or stale replicas after failures or topology changes."
    - q: "What is scrubbing?"
      a: "Consistency checking of objects and metadata by OSDs."
    - q: "What is deep scrub?"
      a: "A more intensive scrub that verifies object data against checksums."
    - q: "What is nearfull?"
      a: "A warning threshold indicating OSD capacity is getting high."
    - q: "Why is full ratio dangerous?"
      a: "Ceph may block writes when OSDs or pools exceed full thresholds."
    - q: "What does ceph osd tree show?"
      a: "OSDs organized by CRUSH topology and state."
    - q: "What does ceph osd df tree show?"
      a: "OSD capacity and utilization in topology form."
    - q: "What does ceph pg query show?"
      a: "Detailed state for a specific placement group."
    - q: "What is cephadm?"
      a: "Ceph's orchestrator-based deployment and management tooling using containers and systemd."
    - q: "What does ceph orch ps show?"
      a: "Ceph daemon placement and status under orchestrator management."
    - q: "What is Rook-Ceph?"
      a: "A Kubernetes operator-driven way to run and manage Ceph clusters."
    - q: "What does the Rook operator do?"
      a: "It reconciles Ceph custom resources into Kubernetes resources and Ceph daemon configuration."
    - q: "What is CephCluster?"
      a: "The Rook custom resource defining cluster-wide Ceph version, placement, storage selection, and policies."
    - q: "What is CephBlockPool?"
      a: "A Rook custom resource defining a RADOS pool for RBD-backed storage."
    - q: "What is CephFilesystem?"
      a: "A Rook custom resource defining CephFS metadata and data pools plus MDS behavior."
    - q: "What is CephObjectStore?"
      a: "A Rook custom resource defining RGW object storage."
    - q: "What does Ceph CSI do?"
      a: "It provisions and attaches RBD or CephFS volumes for Kubernetes PVCs."
    - q: "What is a Rook toolbox?"
      a: "A pod containing Ceph tools for debugging and operating the cluster from inside Kubernetes."
    - q: "Why check StorageClass parameters?"
      a: "Bad pool, filesystem, cluster ID, or provisioner settings can prevent PVC provisioning."
    - q: "Why check Rook operator logs?"
      a: "They show reconciliation failures creating or updating Ceph daemons and resources."
    - q: "Why check CSI pod logs?"
      a: "They reveal provisioning, attach, mount, credentials, and node-plugin errors."
    - q: "How does Rook upgrade Ceph?"
      a: "It rolls daemons after the Ceph image changes and waits for health conditions between steps."
    - q: "Why require healthy PGs before OSD upgrades?"
      a: "Restarting OSDs while data is already degraded increases availability and data-safety risk."
    - q: "What should be checked before removing an OSD?"
      a: "Data health, redundancy, CRUSH placement, backfill capacity, and whether applications can tolerate recovery IO."
istio:
  cards:
    - q: "What is Istio?"
      a: "An open source service mesh that adds traffic management, security, and telemetry to distributed services."
    - q: "What is a service mesh?"
      a: "Infrastructure that handles cross-cutting service-to-service networking concerns outside application code."
    - q: "What is Istio's control plane?"
      a: "The component set that watches desired state and distributes proxy configuration."
    - q: "What is Istio's data plane?"
      a: "The proxies that handle workload traffic according to control-plane configuration."
    - q: "What is sidecar mode?"
      a: "Istio mode where an Envoy proxy runs beside each participating workload pod."
    - q: "What is ambient mode?"
      a: "Istio mode that uses ztunnel and optional waypoint proxies instead of per-pod sidecars."
    - q: "What is ztunnel?"
      a: "A per-node L4 proxy in ambient mode that provides secure overlay, identity, mTLS, and TCP telemetry."
    - q: "What is a waypoint proxy?"
      a: "An Envoy proxy used in ambient mode for L7 routing, authorization, metrics, and policy."
    - q: "When is a waypoint needed?"
      a: "When ambient workloads need L7 features such as HTTP routing or header/path authorization."
    - q: "What proxy does sidecar mode commonly use?"
      a: "Envoy."
    - q: "What is mTLS?"
      a: "Mutual TLS, where both peers authenticate with certificates and encrypt the connection."
    - q: "What does PeerAuthentication control?"
      a: "The mutual TLS mode required or allowed for incoming workload connections."
    - q: "What does AuthorizationPolicy control?"
      a: "Which authenticated sources or requests are allowed to access workloads."
    - q: "What does RequestAuthentication validate?"
      a: "End-user or client JWT credentials."
    - q: "What is a VirtualService?"
      a: "An Istio traffic rule that defines how requests are routed to services or subsets."
    - q: "What is a DestinationRule?"
      a: "A policy defining traffic behavior for a destination after routing, including subsets and TLS settings."
    - q: "What is an Istio Gateway?"
      a: "A resource configuring edge proxy listeners for ingress or egress traffic."
    - q: "What is a ServiceEntry?"
      a: "A resource that adds external or non-Kubernetes services to Istio's service registry."
    - q: "What is an Istio subset?"
      a: "A named group of endpoints, often selected by labels such as version."
    - q: "What does traffic shifting use?"
      a: "VirtualService weighted routes and DestinationRule subsets."
    - q: "What is circuit breaking in Istio?"
      a: "A DestinationRule traffic policy that limits unhealthy or overloaded upstream behavior."
    - q: "What is fault injection?"
      a: "Intentional delay or abort behavior used to test resilience."
    - q: "What is TLS origination?"
      a: "A proxy initiates TLS to an upstream service even if the downstream request was plaintext."
    - q: "What is TLS termination?"
      a: "A proxy ends a TLS connection and forwards traffic to the next hop."
    - q: "What does istioctl proxy-status show?"
      a: "Proxy connection and xDS synchronization state."
    - q: "What does istioctl analyze do?"
      a: "It checks Istio and Kubernetes configuration for common errors."
    - q: "What is xDS?"
      a: "Envoy's family of discovery APIs used to deliver dynamic proxy configuration."
    - q: "What is a sidecar injection label?"
      a: "A namespace or pod label that controls whether Istio injects sidecar proxies."
    - q: "What is ambient enrollment?"
      a: "Adding workloads or namespaces to the ambient mesh so ztunnel handles their traffic."
    - q: "What is HBONE?"
      a: "The HTTP-based overlay tunnel used by Istio ambient mode for secure proxy-to-proxy traffic."
    - q: "What identity style does Istio commonly use?"
      a: "SPIFFE-style workload identities represented in certificates."
    - q: "What is a trust domain?"
      a: "The identity boundary used when forming service identities."
    - q: "Why can mTLS mismatch cause 503s?"
      a: "The client and server side may disagree on whether TLS is required, disabled, or originated by a proxy."
    - q: "Why can a VirtualService appear ignored?"
      a: "Hosts, gateways, namespace scope, export visibility, or match order may not select the traffic."
    - q: "Why can DestinationRule subsets fail?"
      a: "Subset labels may not match any endpoints."
    - q: "What is Kiali used for?"
      a: "Visualizing and inspecting service mesh topology, traffic, and configuration."
    - q: "What metrics does Istio commonly emit?"
      a: "Request volume, success/failure rates, latency, TCP metrics, and workload-level telemetry."
    - q: "What do Envoy access logs show?"
      a: "Per-request details such as source, destination, status, route, response flags, and latency."
    - q: "What is an ingress gateway?"
      a: "A mesh-managed edge proxy that accepts traffic from outside the cluster."
    - q: "What is an egress gateway?"
      a: "A controlled outbound proxy path for traffic leaving the mesh."
    - q: "What is ServiceEntry useful for?"
      a: "Modeling external services so Istio can apply routing, TLS, and telemetry."
    - q: "Why does protocol selection matter?"
      a: "Istio needs to know whether traffic is HTTP, TCP, gRPC, or another protocol for L7 behavior."
    - q: "What is port naming used for?"
      a: "It helps Istio infer protocol behavior for service ports."
    - q: "Why can sidecar resource limits matter?"
      a: "The proxy consumes CPU and memory and can become a bottleneck or be OOM killed."
    - q: "What is proxy readiness?"
      a: "Whether the workload proxy is running, connected, and configured enough to handle traffic."
    - q: "What is a mesh-wide policy risk?"
      a: "A broad policy can unexpectedly affect many workloads or namespaces."
    - q: "What is the first Istio troubleshooting split?"
      a: "Decide whether the issue is Kubernetes endpoints, proxy config, TLS, authorization, routing, or the app."
    - q: "Why compare Kubernetes endpoints with Istio routes?"
      a: "Kubernetes may have endpoints while Istio routing selects a different host, subset, or gateway."
    - q: "What does sidecarless mesh refer to?"
      a: "Istio ambient mode, where workloads join the mesh without per-pod sidecar proxies."
    - q: "What is the main operational benefit of ambient mode?"
      a: "Incremental mesh adoption with fewer per-pod proxy lifecycle and resource concerns."
