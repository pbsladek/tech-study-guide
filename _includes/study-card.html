<div class="study-card" tabindex="0" role="button" aria-pressed="false">

    <div class="study-card-face study-card-front">
      <span>Question</span>
      <p>{{ include.question }}</p>

      <span>Answer</span>
      <p>{{ include.answer }}</p>
    </div>
  </div>
</div>
