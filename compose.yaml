services:
  site:
    build: .
    image: ${IMAGE:-tech-study-guide-jekyll}
    container_name: ${CONTAINER_PREFIX:-tech-study-guide}-serve-${PORT:-4030}
    working_dir: /site
    volumes:
      - .:/site
    ports:
      - "${PORT:-4030}:${PORT:-4030}"
    command:
      - bundle
      - exec
      - jekyll
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "${PORT:-4030}"
      - --force_polling
